name: Bug report
description: A script crashed, reported a wrong finding (false positive/negative), or a skill gave wrong or unsafe advice
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real secrets, tokens, cookies, HAR files or private code.** Reduce the input to a
        minimal, redacted example with obviously fake values (for example `not-a-real-token`).
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - secrets-scan
        - dependency-audit
        - owasp-web-review
        - threat-modeling
        - auth-session-review
        - security-headers-check
        - input-validation-review
        - dockerfile-security
        - incident-response-playbook
        - validator / repository tooling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, its output, and (for wrong findings) a minimal redacted input.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.12, Claude Code / Codex CLI"
    validations:
      required: true
